name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run verify

      # Pages no conoce las rutas de Angular: 404.html sirve la app para los enlaces directos (/servicios, /contacto…)
      - run: cp dist/pensildevs-web/browser/index.html dist/pensildevs-web/browser/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/pensildevs-web/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
